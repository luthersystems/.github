name: govulncheck gate
description: >-
  Scan each Go module with govulncheck and fail on a called finding that no
  live row of the repo's exemptions file covers.

# Why this is an action: twelve repos carried their own copy of the
# govulncheck scripts, in five versions, and eight installed govulncheck
# @latest, so the same commit could pass on Monday and fail on Tuesday with
# no change. One copy, pinned, released with this repo's tags, gives every
# repo the same scanner and the same rule.
#
# Needs: Go on PATH (the caller sets it up from the repo's go.mod, so the
# stdlib scanned is the one we ship), python3, and access to private modules
# when the repo has any.

inputs:
  directories:
    description: >-
      Module directories to scan, space separated. Empty: every go.mod
      outside vendor/, testdata/ and node_modules/.
    required: false
    default: ""
  exemptions:
    description: >-
      Exemptions file, relative to the repo root. Each row is
      `GO-YYYY-N | expires (YYYY-MM-DD) | owner/repo#N | reason`. A missing
      file means no finding is exempt.
    required: false
    default: .github/security/govulncheck-exemptions.txt
  binary:
    description: >-
      true: also build each main package and scan the binary, which finds
      code reached by reflection. Costs a build, so the workflow sets it on
      scheduled scans only.
    required: false
    default: "false"
  version:
    description: govulncheck version (golang.org/x/vuln). Pinned so a release cannot change a result with no change in the repo.
    required: false
    default: v1.8.0

runs:
  using: composite
  steps:
    # The Go that builds the tool goes in the cache key. golangci-lint,
    # gosec, govulncheck, apidiff and apibreak type-check the caller's code
    # with the go/types of the Go they were built with, and that Go must be at
    # least the caller's. Without it, a binary built by a Go 1.26 run was
    # restored for a Go 1.27 run and failed with "the Go language version
    # (go1.26) used to build golangci-lint is lower than the targeted Go
    # version" (luthersystems/elps#929).
    - id: go
      shell: bash
      run: echo "version=$(go env GOVERSION)" >>"$GITHUB_OUTPUT"
    # Restores the binary this repo built for this version, if any (see
    # lib/go-install.sh for why a cache and why go install).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/luther-tools/govulncheck-${{ inputs.version }}
        key: luther-tool-${{ runner.os }}-${{ runner.arch }}-govulncheck-${{ inputs.version }}-${{ steps.go.outputs.version }}
    - name: Install govulncheck
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DIR: ${{ runner.temp }}/luther-tools/govulncheck-${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/../lib/go-install.sh" "$DIR" "golang.org/x/vuln/cmd/govulncheck@${VERSION}" govulncheck
    - name: Run govulncheck
      shell: bash
      env:
        DIRS: ${{ inputs.directories }}
        EXEMPTIONS: ${{ inputs.exemptions }}
        BINARY: ${{ inputs.binary }}
      run: bash "$GITHUB_ACTION_PATH/govulncheck.sh"
