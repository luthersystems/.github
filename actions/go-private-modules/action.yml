name: Go private modules
description: Let go fetch the private modules named in GOPRIVATE over SSH.

# Why: a repo that imports luthersystems/license (a private module) cannot
# build, so cannot be type-checked or scanned, without it. The proxy does not
# serve private modules, so go must fetch them with git over SSH. With no key
# this does nothing, so repos with no private module need no secret.

inputs:
  ssh-private-key:
    description: SSH key (or keys, one after another) that can read the private modules.
    required: false
    default: ""
  goprivate:
    description: GOPRIVATE value, the module paths go fetches directly.
    required: false
    default: github.com/luthersystems/license

runs:
  using: composite
  steps:
    - name: Check for an SSH key
      id: key
      shell: bash
      env:
        KEY: ${{ inputs.ssh-private-key }}
      run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
    - if: steps.key.outputs.present == 'true'
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - name: Fetch private modules over SSH
      if: steps.key.outputs.present == 'true'
      shell: bash
      env:
        GOPRIVATE_IN: ${{ inputs.goprivate }}
      run: |
        echo "GOPRIVATE=$GOPRIVATE_IN" >>"$GITHUB_ENV"
        git config --global url."git@github.com:".insteadOf "https://github.com/"
