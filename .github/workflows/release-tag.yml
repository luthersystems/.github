name: Release (tag)

# Shared release cut for luthersystems libraries, called with workflow_call
# from each repo's own small release-tag.yml.
#
# Why it is shared: by 2026-10 nineteen repos carried their own copy of a
# release-tag workflow, and the copies drifted. luthersystems/svc's original
# left two checks to the person who dispatched it; the copies made for
# insideout-terraform-presets#897 and libmxf#11 added them because an agent
# dispatches them. One copy here means a fix (or a new check) lands once.
#
# Why it lives in a public repo: GitHub lets other repos call a private repo's
# workflows only when they are private or internal too, and most callers
# (svc, the presets, libmxf, the SDKs) are public. The workflow holds no
# secret: it tags the CALLING repo with the caller's own token.
#
# Checks, in order:
# - The run is on main and its commit is GitHub's live main, so a stale
#   dispatch cannot tag an older commit.
# - The caller's CI workflow (input ci_workflow) has a successful push run
#   for that commit, so a red main is never released.
# - The version is vMAJOR.MINOR.PATCH with no leading zeros (Go ignores
#   v0.012.0 as a module version, so such a tag could never be fetched), is
#   not tagged yet, and is strictly newer than the latest release tag of its
#   own major. Its major must be at least the highest major among tags on
#   main, and, when the caller sets input majors, one of those majors. The
#   same-major rule lets a repo keep tags of an experimental later major off
#   main (substrate's v3) without refusing releases of main's line (v2).
#
# A Go module in a subdirectory is fetched by tags named
# <dir>/vMAJOR.MINOR.PATCH, so input tag_prefix (e.g. "wasm/") puts that
# prefix on the tag and the release. <dir> is the module's directory without
# a /vN major suffix: module .../wasm/v2 in wasm/v2/ takes tag_prefix "wasm/"
# and tags wasm/v2.0.0. Every version rule above reads only the caller's tags
# with that prefix. A prefixed release is never marked the repo's latest
# release, which stays the main module's. The first release under a prefix
# has no start tag, so its generated notes reach back to the repo's latest
# release; set notes_command for it if that matters.
#
# Token (input release_token):
# - github (default): the caller's GITHUB_TOKEN creates the tag and the
#   release. GitHub starts no workflow for an event made with that token, so
#   use it only in a repo where the tag triggers nothing (a Go library that
#   consumers fetch by tag).
# - claude-app: the official Claude App creates the release, so the tag push
#   starts the repo's own tag workflows (an image build, a deploy). The App
#   token is only minted by anthropics/claude-code-action, so a Claude run
#   does the one write. Every check stays in shell, Claude may run only the
#   one pre-built `gh release create` command (a PreToolUse hook refuses any
#   other tool call), and a last shell step checks the tag landed on the
#   validated commit. The model runs on Amazon Bedrock through the AWS role
#   github-actions-claude-bedrock (luthersystems/common-infrastructure
#   storage/github_actions_claude_bedrock.tf). Its trust names the CALLING
#   repo, because a called workflow's OIDC `sub` is the caller's, so each
#   caller must be on that role's list.
#
# Caller contract: a called workflow cannot raise its caller's token
# permissions, so the calling job grants `actions: read` (read the CI runs).
# github mode also grants `contents: write` (GITHUB_TOKEN creates the
# release). claude-app grants `contents: read` and `id-token: write`
# (Bedrock and the App token): the App token does the write, so the
# GITHUB_TOKEN needs no write there. claude-app needs node and npm on the
# runner (ubuntu-latest has them) to install the pinned Claude Code CLI. In a called workflow the github context is
# the caller's, so github.repository, github.ref and github.sha below name
# the calling repo and its dispatch.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to tag (vMAJOR.MINOR.PATCH). Empty = auto-bump the patch of the latest tag in main's major line."
        type: string
        required: false
        default: ""
      dry_run:
        description: "Print the computed version but do NOT cut the release"
        type: boolean
        required: false
        default: false
      ci_workflow:
        description: "File name of the caller's CI workflow, e.g. svc.yml. It must run on push to main."
        type: string
        required: true
      ci_wait_minutes:
        description: "Minutes (at most 30) to wait for a CI push run still in progress on the release commit"
        type: number
        required: false
        default: 15
      majors:
        description: >-
          Space-separated majors that may be released, e.g. "2". Empty = any
          major at or above the highest one on main. Set it when a later major
          is experimental (substrate's v3), so main cannot get a release of it.
        type: string
        required: false
        default: ""
      release_token:
        description: "github (default GITHUB_TOKEN) or claude-app (Claude App token, so the tag triggers workflows)"
        type: string
        required: false
        default: github
      notes_command:
        description: "Optional shell command, run in the caller's checkout, whose stdout is the release notes. LAST_TAG holds the previous release tag. Empty = GitHub's generated notes."
        type: string
        required: false
        default: ""
      tag_prefix:
        description: >-
          Prefix of the tag and the release, for a Go module in a
          subdirectory: "wasm/" releases wasm/vMAJOR.MINOR.PATCH. Empty =
          vMAJOR.MINOR.PATCH. Versions are compared only among tags with
          this prefix.
        type: string
        required: false
        default: ""
      runs_on:
        description: "runs-on for the job, as JSON (a string or a list of labels)"
        type: string
        required: false
        default: '"ubuntu-latest"'
    outputs:
      version:
        description: "The version released (or, on a dry run, the one that would be)"
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "The tag released: tag_prefix and version"
        value: ${{ jobs.release.outputs.tag }}

jobs:
  release:
    name: Cut release
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Room for the longest CI wait (ci_wait_minutes, at most 30) plus one
    # Claude run; expressions cannot add, so this is a fixed ceiling.
    timeout-minutes: 60
    # One release at a time per calling repo. A queued release waits rather
    # than cancels, so two dispatches never race for the same next version.
    concurrency:
      group: release-tag-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    env:
      TAG_PREFIX: ${{ inputs.tag_prefix }}
    steps:
      - name: Check the release mode
        env:
          RELEASE_TOKEN: ${{ inputs.release_token }}
        run: |
          case "$RELEASE_TOKEN" in
            github|claude-app) ;;
            *) echo "error: release_token must be github or claude-app, not '$RELEASE_TOKEN'" >&2; exit 1 ;;
          esac
          # The prefix reaches API paths, git and the release command, so
          # allow only directories of plain characters ending in /, and only
          # ones git accepts in a tag name (no component ending in . or
          # .lock), so a bad prefix fails here, not after the CI wait.
          [[ -z "$TAG_PREFIX" || ( "$TAG_PREFIX" =~ ^([A-Za-z0-9][A-Za-z0-9._-]*/)+$ && "$TAG_PREFIX" != *..* ) ]] \
            && git check-ref-format "refs/tags/${TAG_PREFIX}v0.0.0" || {
            echo "error: tag_prefix '$TAG_PREFIX' must be empty or directories ending in /, such as wasm/" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, for latest-version detection
          persist-credentials: false # gh uses GH_TOKEN; git only reads tags
      - name: Check the commit is live main and CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
          CI_WAIT_MINUTES: ${{ inputs.ci_wait_minutes }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "error: dispatch this workflow on main, not $GITHUB_REF" >&2
            exit 1
          fi
          live=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "error: run commit $GITHUB_SHA is not live main $live; dispatch again" >&2
            exit 1
          fi
          # A release is often dispatched right after a merge, while the
          # merge's CI run is still going, so wait for it rather than make
          # the operator dispatch again. A failed run fails at once: waiting
          # will not fix it.
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "error: GITHUB_SHA is not a 40-hex commit" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "error: checkout is not $GITHUB_SHA" >&2; exit 1; }
          # A number input also takes 1.5 or -3; only whole minutes 0-30 fit
          # inside the job's 60-minute ceiling with room for the release.
          if ! [[ "$CI_WAIT_MINUTES" =~ ^[0-9]+$ ]] || [ "$CI_WAIT_MINUTES" -gt 30 ]; then
            echo "error: ci_wait_minutes must be a whole number from 0 to 30, not '$CI_WAIT_MINUTES'" >&2
            exit 1
          fi
          now=$(date +%s)
          deadline=$(( now + CI_WAIT_MINUTES * 60 ))
          # With no run at all, CI may simply not be queued yet; but a
          # workflow that never runs on this commit (paths-ignore, no push
          # trigger) would otherwise burn the whole wait. 3 minutes covers
          # queueing.
          norun_deadline=$(( now + 180 ))
          while :; do
            # Only main's push runs of this exact workflow count: a push of
            # the same commit to another branch can pass where main's run,
            # with main-only jobs, failed. The newest attempt decides, as a
            # re-run that failed supersedes an earlier success.
            newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push" and .head_sha == env.GITHUB_SHA and .path == ".github/workflows/" + env.CI_WORKFLOW)]
               | sort_by([.created_at, .run_attempt, .id]) | last
               | if . == null then "" else "\(.status) \(.conclusion // "-") \(.html_url)" end')
            if [ -z "$newest" ]; then
              if [ "$(date +%s)" -ge "$norun_deadline" ] || [ "$(date +%s)" -ge "$deadline" ]; then
                echo "error: no push run of $CI_WORKFLOW on main exists for $GITHUB_SHA; check that it runs on push to main" >&2
                exit 1
              fi
            else
              read -r status conclusion url <<<"$newest"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && break
                echo "error: newest push run of $CI_WORKFLOW for $GITHUB_SHA is $conclusion ($url); fix or re-run it" >&2
                exit 1
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "error: $CI_WORKFLOW for $GITHUB_SHA still $status after ${CI_WAIT_MINUTES}m ($url)" >&2
                exit 1
              fi
            fi
            echo "waiting for $CI_WORKFLOW on $GITHUB_SHA (newest: ${newest:-none})"
            sleep 20
          done
          # Main can move during the wait; tag only what is still main.
          live=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "error: main moved to $live during the CI wait; dispatch again" >&2
            exit 1
          fi
          echo "commit $GITHUB_SHA is live main and $CI_WORKFLOW passed"
      - name: Compute and validate version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          MAJORS: ${{ inputs.majors }}
        run: |
          set -euo pipefail
          # One version rule for every repo. A new version must be newer than
          # the latest tag OF ITS OWN MAJOR, and its major must be at least
          # the highest major among tags on main. With one major line this is
          # "newer than the latest tag". It also lets a repo keep tags of a
          # later major off main (substrate's experimental v3.0.0) without
          # refusing every release of main's line (v2.x).
          # Python, not sort -V or bash arithmetic: sort -V treats v1.2.08 and
          # v1.2.8 as equal, and bash overflows past 64 bits.
          picked=$(python3 -I - "$REQUESTED" "$MAJORS" "$TAG_PREFIX" <<'PY'
          import re, subprocess, sys
          STABLE = re.compile(r"^v[0-9]+\.[0-9]+\.[0-9]+$")
          def key(t):
              return tuple((len(p.lstrip("0")), p.lstrip("0")) for p in t[1:].split("."))
          PREFIX = sys.argv[3]
          def tags(*args):
              # Versions of the tags with the caller's prefix, prefix removed.
              out = subprocess.run(["git", "tag", "--list", PREFIX + "v*", *args], check=True,
                                   capture_output=True, text=True).stdout.split()
              out = [t[len(PREFIX):] for t in out]
              return [t for t in out if STABLE.fullmatch(t)]
          all_tags, main_tags = tags(), tags("--merged", "HEAD")
          main_major = max((key(t)[0] for t in main_tags), default=None)
          requested = sys.argv[1]
          majors = sys.argv[2].split()
          if any(not re.fullmatch(r"0|[1-9][0-9]*", m) for m in majors):
              sys.exit(f"majors must be whole numbers without leading zeros, not {sys.argv[2]!r}")
          if requested:
              version = requested
          elif main_major is None:
              sys.exit("no vMAJOR.MINOR.PATCH tag on main to bump from; pass an explicit version")
          else:
              base = max((t for t in all_tags if key(t)[0] == main_major), key=key)
              major, minor, patch = (int(p) for p in base[1:].split("."))
              version = f"v{major}.{minor}.{patch + 1}"
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              sys.exit(f"version {version!r} is not vMAJOR.MINOR.PATCH without leading zeros")
          if main_major is not None and key(version)[0] < main_major:
              sys.exit(f"{version} is below major {main_major[1] or '0'}, the highest on main")
          if majors and version[1:].split(".")[0] not in majors:
              sys.exit(f"{version}: major is not in majors ({' '.join(majors)}); this repo releases only those")
          same = [t for t in all_tags if key(t)[0] == key(version)[0]]
          latest = max(same, key=key) if same else ""
          if latest and key(version) <= key(latest):
              sys.exit(f"version {version} is not strictly newer than {latest}, the latest tag of its major")
          print(version, PREFIX + latest if latest else "")
          PY
          ) || { echo "error: version check failed" >&2; exit 1; }
          read -r version latest <<<"$picked"
          # [[ =~ ]] tests the whole value; grep would pass a value with a
          # valid first line and more lines after it.
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "error: version '$version' is not vMAJOR.MINOR.PATCH without leading zeros" >&2
            exit 1
          }
          # A second dispatch queued behind the first (concurrency above)
          # runs on the same live main and would auto-bump again, cutting a
          # second release of one commit. Refuse a commit already released.
          already=""
          for t in $(git tag --points-at "$GITHUB_SHA" --list "${TAG_PREFIX}v*"); do
            [[ "${t#"$TAG_PREFIX"}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && already+="$t "
          done
          if [ -n "$already" ]; then
            echo "error: commit $GITHUB_SHA is already released as $already" >&2
            exit 1
          fi
          tag="$TAG_PREFIX$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "error: tag $tag already exists" >&2
            exit 1
          fi
          # The checkout's tags date from before the CI wait, which can last
          # 30 minutes, so ask GitHub too. gh release create would otherwise
          # publish onto a tag pushed in that window, whatever it points at.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -qxF "refs/tags/$tag" <<<"$refs"; then
            echo "error: tag $tag already exists on GitHub" >&2
            exit 1
          fi
          echo "computed version: $version, tag $tag (latest existing: ${latest:-none})"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
      - name: Build the release command
        id: cmd
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          LAST_TAG: ${{ steps.ver.outputs.latest }}
          NOTES_COMMAND: ${{ inputs.notes_command }}
        run: |
          set -euo pipefail
          notes_args="--generate-notes"
          # Without a start tag GitHub diffs against the latest release of any
          # major, so a v2 release after an experimental v3.0.0 would list
          # everything since v3. Start from the latest tag of this major.
          if [ -n "$LAST_TAG" ]; then
            notes_args="--generate-notes --notes-start-tag $LAST_TAG"
          fi
          # A subdirectory module's release must not take the repo's Latest
          # release from the main module's line.
          if [ -n "$TAG_PREFIX" ]; then
            notes_args="--latest=false $notes_args"
          fi
          if [ -n "$NOTES_COMMAND" ]; then
            notes_path="$RUNNER_TEMP/release-notes.md"
            # The caller's own command in the caller's own checkout: it is
            # repo configuration, not dispatch input.
            LAST_TAG="$LAST_TAG" bash -c "$NOTES_COMMAND" > "$notes_path"
            notes_args="${notes_args%%--generate-notes*}--notes-file $notes_path"
          fi
          # Every value here is a validated version or tag, a 40-hex SHA,
          # the repo name or a runner path, so the command needs no quoting;
          # the claude-app hook compares Claude's command to this exact
          # string.
          cmd="gh release create $TAG --repo $GITHUB_REPOSITORY --title $TAG --target $GITHUB_SHA $notes_args"
          [[ "$cmd" =~ ^[A-Za-z0-9_./:=\ -]+$ ]] || { echo "error: unsafe release command: $cmd" >&2; exit 1; }
          printf '%s' "$cmd" > "$RUNNER_TEMP/release-command.txt"
          chmod 400 "$RUNNER_TEMP/release-command.txt"
          echo "command=$cmd" >> "$GITHUB_OUTPUT"
      - name: Dry run — print only
        if: ${{ inputs.dry_run }}
        env:
          CMD: ${{ steps.cmd.outputs.command }}
        run: |
          echo "DRY RUN — would run: $CMD"
          if [ -f "$RUNNER_TEMP/release-notes.md" ]; then
            # Stop workflow commands so notes text cannot act as one.
            token=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
            echo "::stop-commands::$token"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "::$token::"
          fi
      - name: Cut release
        if: ${{ !inputs.dry_run && inputs.release_token == 'github' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash -c "$(cat "$RUNNER_TEMP/release-command.txt")"
      # claude-code-action@v1 bundles a Claude Code CLI that can lag the
      # pinned model: claude-opus-5-5 needs >= 2.1.280 (elps run
      # 35825136056 failed with claude_code_version_too_old). Bump with the
      # model pin.
      - name: Install pinned Claude Code CLI
        id: claude_cli
        # Also on a dry run, so the dry run proves npm and the CLI work on
        # this runner before a real release depends on them.
        if: ${{ inputs.release_token == 'claude-app' }}
        run: |
          command -v npm >/dev/null || { echo "error: claude-app needs node and npm on the runner" >&2; exit 1; }
          npm install -g @anthropic-ai/claude-code@2.1.280
          echo "path=$(command -v claude)" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials for Bedrock (OIDC)
        if: ${{ !inputs.dry_run && inputs.release_token == 'claude-app' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::637423319757:role/github-actions-claude-bedrock
          aws-region: us-west-2
      - name: Install exact-command guard
        id: guard
        if: ${{ !inputs.dry_run && inputs.release_token == 'claude-app' }}
        run: |
          set -euo pipefail
          hook_path="$RUNNER_TEMP/release-tool-guard.py"
          cat > "$hook_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          try:
              expected = Path(__file__).with_name("release-command.txt").read_text()
              payload = json.load(sys.stdin)
              permitted = (
                  bool(expected) and isinstance(payload, dict) and
                  payload.get("tool_name") == "Bash" and
                  isinstance(payload.get("tool_input"), dict) and
                  payload["tool_input"].get("command") == expected
              )
          except (OSError, ValueError, TypeError, RecursionError):
              permitted = False
          if not permitted:
              print("Deny: only Bash with the exact validated release command is permitted.", file=sys.stderr)
              sys.exit(2)
          PY
          chmod 500 "$hook_path"
          settings=$(jq -cn --arg command "python3 -I $hook_path || exit 2" '{
            includeGitInstructions: false,
            hooks: {PreToolUse: [{matcher: "*", hooks: [{type: "command", command: $command}]}]}
          }')
          echo "settings=$settings" >> "$GITHUB_OUTPUT"
          cmd=$(cat "$RUNNER_TEMP/release-command.txt")
          echo "claude_args=--tools Bash --allowedTools 'Bash($cmd)' --disallowedTools Read,Grep,Glob,LS,Edit,Write,WebFetch,WebSearch,Task --max-turns 10 --model us.anthropic.claude-opus-5-5 --fallback-model us.anthropic.claude-sonnet-5-5" >> "$GITHUB_OUTPUT"
      - name: Cut the release via Claude
        if: ${{ !inputs.dry_run && inputs.release_token == 'claude-app' }}
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          # Official App auth, minted through OIDC (`id-token: write`). Do not
          # set github_token: a GITHUB_TOKEN tag would start no workflow.
          use_bedrock: "true"
          path_to_claude_code_executable: ${{ steps.claude_cli.outputs.path }}
          settings: ${{ steps.guard.outputs.settings }}
          prompt: |
            Cut a release of ${{ github.repository }}. The version, the main
            commit and CI were validated by trusted shell steps.
            Run exactly this command once, with no changes:
            ${{ steps.cmd.outputs.command }}
            Run no other commands and do not change any files or branches.
          claude_args: ${{ steps.guard.outputs.claude_args }}
      # The action keeps Claude's transcript out of the job log; keep it as
      # an artifact so a refused or failed command can be explained later.
      - name: Capture agent trace
        if: ${{ always() && !inputs.dry_run && inputs.release_token == 'claude-app' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tag-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify release and tag target
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "error: $*" >&2; exit 1; }
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease) \
            || fail "release $TAG was not found"
          jq -e --arg v "$TAG" '.tagName == $v and .isDraft == false and .isPrerelease == false' >/dev/null <<<"$release" \
            || fail "release $TAG is a draft or a pre-release: $release"
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object) \
            || fail "tag ref $TAG was not found"
          # Peel annotated tags to the commit they name.
          for _ in $(seq 10); do
            type=$(jq -r .type <<<"$object"); sha=$(jq -r .sha <<<"$object")
            if [ "$type" = commit ]; then
              [ "$sha" = "$GITHUB_SHA" ] || fail "tag $TAG points at $sha, not $GITHUB_SHA"
              echo "released $TAG at $GITHUB_SHA"
              exit 0
            fi
            [ "$type" = tag ] || fail "tag $TAG does not resolve to a commit"
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object)
          done
          fail "tag $TAG nests too deeply"
