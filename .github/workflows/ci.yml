name: CI

# Why: this repo holds shared workflows and actions that other luthersystems
# repos call. An error here breaks every caller at once, so each pull request
# lints the workflows and tests the harden-check action before they can merge.
# release.yml releases only a main commit whose push run of this workflow
# passed, so a tag never points at a red commit.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actionlint and shellcheck are pinned to exact versions so a new
      # release cannot turn a green PR red without a change in this repo.
      # actionlint runs shellcheck on each run: block when it is on PATH.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          v=v0.10.0
          t=$RUNNER_TEMP/shellcheck.tar.xz
          curl -fsSL -o "$t" "https://github.com/koalaman/shellcheck/releases/download/$v/shellcheck-$v.linux.x86_64.tar.xz"
          # The checksum of the reviewed release: a changed tarball fails.
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $t" | sha256sum -c -
          tar -xJ -C "$RUNNER_TEMP" -f "$t"
          echo "$RUNNER_TEMP/shellcheck-$v" >>"$GITHUB_PATH"
      # Other repos call these with @v1. A file that loses its workflow_call
      # trigger still passes actionlint, but every caller then fails at
      # startup. That happened in v1.4.0: a caller replaced security.yml.
      - name: Check the reusable workflows keep workflow_call
        run: |
          set -euo pipefail
          for f in security quality benchmark release-tag; do
            if ! grep -q '^  workflow_call:' ".github/workflows/$f.yml"; then
              echo "::error file=.github/workflows/$f.yml::no workflow_call trigger: every caller of $f.yml@v1 would fail at startup"
              exit 1
            fi
          done
      # security.yml and quality.yml repeat one runs-on expression on every
      # job (GitHub has no shared runs-on). A job whose copy drifts runs
      # somewhere its siblings do not, which shows only as a queued job.
      # security.yml's autofix is the one exception: it holds write
      # credentials, so it is always on ubuntu-latest, never the GCP pool.
      - name: Check every shared job picks its runner the same way
        run: |
          set -euo pipefail
          n="$(grep -h '^    runs-on:' .github/workflows/security.yml .github/workflows/quality.yml | grep -vx '    runs-on: ubuntu-latest' | sort -u | wc -l)"
          if [ "$n" -ne 1 ]; then
            grep -n '^    runs-on:' .github/workflows/security.yml .github/workflows/quality.yml
            echo "::error::the jobs of security.yml and quality.yml use $n different runs-on expressions; keep one"
            exit 1
          fi
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Run shellcheck on the action scripts
        run: shellcheck -x actions/*/*.sh actions/*/check/*.sh tests/*/*.sh tests/quality/testdata/api-break/surface.sh

  # A passing case runs the action as a caller does (uses: ./actions/...).
  # A failing case runs the action's script with the same inputs and asserts
  # the exit code and the reason, so neither a check that passes everything
  # nor one that fails for another reason (a pull error, a crash) passes here.
  harden-check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both architectures the repos build on: the kit and the check must
        # work on the arm runners too.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      KIT: luthersystems/build-harden:v0.1.46@sha256:f3c02942cf086e8b976f0bf3e7a089bd29efdb34e788f0eaad64f38db76d4c05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Pass: a hardened base image, both platforms"
        uses: ./actions/harden-check
        with:
          kit: ${{ env.KIT }}
          images: luthersystems/service-base-alpine:v0.1.46@sha256:5837ed9fc5d0db08314ffed43306a9c0779f85c990ee3b40b22236c4f779b988
          platforms: linux/amd64 linux/arm64

      - name: Build the fixture images
        run: |
          set -euo pipefail
          docker build -q -t harden-check-test/nss-other-nickname tests/harden-check/nss-other-nickname
          docker build -q -t harden-check-test/chrome-no-nssdb tests/harden-check/chrome-no-nssdb
          docker build -q -t harden-check-test/debian-jdk tests/harden-check/debian-jdk
          docker build -q -t harden-check-test/keep-removed tests/harden-check/keep-removed

      # buildenv#165: a listed certificate under another nickname, and a
      # headless-shell binary with an NSS database. The kit is read from the
      # Dockerfile, and the image line names its platform.
      - name: "Pass: NSS match by fingerprint, headless-shell with an NSS database"
        uses: ./actions/harden-check
        with:
          dockerfiles: tests/harden-check/nss-other-nickname/Dockerfile
          # A file shaped like connectorhub's Dockerfile-go: it must pin the
          # kit read from the Dockerfile above.
          same-kit: tests/harden-check/same-kit/same-kit.Dockerfile
          images: harden-check-test/nss-other-nickname ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}

      # buildenv#166: a Debian JDK links cacerts and blocked.certs to /etc.
      # The kit must edit the linked blocked.certs, and the check must follow
      # both links inside the image.
      - name: "Pass: a Debian JDK whose blocked.certs is a link"
        uses: ./actions/harden-check
        with:
          dockerfiles: tests/harden-check/debian-jdk/Dockerfile
          images: harden-check-test/debian-jdk ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}

      - name: Dockerfile check cases
        run: bash tests/harden-check/dockerfile-test.sh

      - name: "Fail: the failing cases fail, for the right reason"
        run: bash tests/harden-check/expect-fail.sh

  # The security workflow's actions, run as a caller runs them (uses:
  # ./actions/...) on inputs that must pass, which also installs each pinned
  # tool. Then the test script runs every check on inputs that must fail, and
  # asserts the reason, so a check that passes everything cannot pass here.
  # The workflow itself (security.yml) calls the actions at @v1, so it is
  # tested through its callers once a release moves v1.
  security-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans this PR's commits
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: "Detect: test fixtures are not modules to scan"
        id: detect
        uses: ./actions/security-detect
      - name: Check the detected modules
        env:
          DIRS: ${{ steps.detect.outputs.go-directories }}
        run: |
          if [ -n "$DIRS" ]; then
            echo "::error::detect found modules under testdata: $DIRS"
            exit 1
          fi

      - name: "Pass: govulncheck on a clean module"
        uses: ./actions/govulncheck
        with:
          directories: tests/security/testdata/go-clean
          binary: "true"
      - name: "Pass: gosec on a clean module"
        uses: ./actions/gosec
        with:
          directories: tests/security/testdata/go-clean
      - name: "Pass: gitleaks on this change"
        uses: ./actions/gitleaks
      - name: "Pass: osv-scanner on this repo, fixtures left out"
        uses: ./actions/osv-scan
        with:
          exclude: tests

      - name: "Pass: trivy config on this repo, fixtures left out"
        uses: ./actions/trivy-config
        with:
          skip-dirs: tests
      - name: "Pass: semgrep on this repo"
        uses: ./actions/semgrep

      - name: Fail and pass cases of each check
        # The semgrep step above left semgrep on PATH and the pinned rules
        # in the workspace; the test script runs its cases against them.
        env:
          RULES: ${{ runner.temp }}/luther-semgrep-rules
        run: bash tests/security/security-test.sh
      - name: Drift issue cases
        run: node tests/security/drift-test.cjs
      - name: Auto-fix prompt and permissions cases
        run: bash tests/security/autofix-test.sh
      - name: Auto-fix failure report cases
        run: node tests/security/autofix-report-test.cjs
      - name: osv gate version and fix cases
        run: python3 tests/security/osv_gate_test.py

  # The quality workflow's actions, run as a caller runs them (uses:
  # ./actions/...), which also installs each pinned tool. Then each test
  # script runs its gate on cases that must fail and must pass, and asserts
  # the reason. quality.yml calls the actions at @v1, so it is tested through
  # its callers once a release moves v1.
  quality-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # This repo follows its own rule: every marker names an open issue.
      - name: "Pass: work markers on this repo"
        uses: ./actions/work-markers
        with:
          check-issues: ${{ github.event_name == 'pull_request' }}
      - name: "Pass: golangci-lint on a clean module"
        uses: ./actions/golangci-lint
        with:
          directories: tests/quality/testdata/golangci/clean
      - name: Work marker cases
        run: bash tests/quality/work-markers-test.sh
      - name: golangci-lint cases
        run: bash tests/quality/golangci-lint-test.sh
      - name: API break cases
        run: bash tests/quality/api-break-test.sh

  # The benchmark actions: the script cases with fake tools, then one real
  # run of both actions on a tiny module, as benchmark.yml runs them. Both
  # arms are the same code, so the real run asserts only that the gate
  # reached a verdict and wrote the comment: on a shared runner, identical
  # code can still read as noise (exit 3) or, rarely, as a move (exit 1).
  benchmark-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Benchmark script cases
        run: bash tests/benchmark/benchmark-test.sh
      - name: Lay out the two arms
        run: |
          set -euo pipefail
          # Where benchmark.yml checks them out: base/ and pr/ in the workspace.
          cp -r tests/benchmark/testdata/module base
          cp -r tests/benchmark/testdata/module pr
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/benchmark/testdata/module/go.mod
          cache: false
      - name: "Run: both arms, interleaved"
        uses: ./actions/benchmark-run
        with:
          count: 6
          benchtime: 10ms
      - name: "Gate: compare and decide"
        id: gate
        uses: ./actions/benchmark-gate
        continue-on-error: true
        with:
          comment: "false"
          count: 6
      - name: Check the gate reached a verdict
        env:
          STATUS: ${{ steps.gate.outputs.gate-status }}
          COMMENT: ${{ steps.gate.outputs.comment-file }}
        run: |
          set -euo pipefail
          echo "gate status: ${STATUS:-<none>}"
          case "$STATUS" in 0 | 1 | 3) ;; *) echo "::error::the gate reached no verdict (status ${STATUS:-<none>})"; exit 1 ;; esac
          grep -q '^## Benchmark comparison (base vs PR)' "$COMMENT"
