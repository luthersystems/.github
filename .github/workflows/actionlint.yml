name: actionlint

# Why: this repo holds shared workflows that other luthersystems repos call
# with workflow_call. A syntax or expression error here breaks every caller at
# once, so each pull request lints the workflows before they can merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actionlint is pinned to an exact version so a new release cannot
      # turn a green PR red without a change in this repo.
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
